<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg { position: fixed; inset: 0; z-index: 0; }
    .bg video, .bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bg::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .name {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .subtitle {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 22px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .cta-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.98); }
    .cta-btn .arrow {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cta-btn .arrow svg { width: 14px; height: 14px; fill: #fff; }
    .cta-btn.secondary {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }
    .cta-btn.secondary:active { background: rgba(255,255,255,0.15); }
  </style>

  {% if clarity_id %}
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "{{ clarity_id }}");
  </script>
  {% endif %}

  {% if ga_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","{{ ga_id }}");</script>
  {% endif %}
</head>
<body>
  <div class="bg">
    {% if hero_url %}
      {% if hero_url.endswith('.mp4') or hero_url.endswith('.webm') or hero_url.endswith('.mov') %}
        <video src="{{ hero_url }}" autoplay muted loop playsinline></video>
      {% else %}
        <img src="{{ hero_url }}" alt="{{ name }}">
      {% endif %}
    {% endif %}
  </div>

  <div class="content">
    <div class="name">{{ name }}</div>
    {% if subtitle %}<div class="subtitle">{{ subtitle }}</div>{% endif %}

    <div class="cta-btn" onclick="handleClick('{{ cta_link }}', 'main_button')">
      {{ cta_text }}
      <span class="arrow">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </span>
    </div>

    <div class="cta-btn secondary" onclick="handleClick('{{ tg_link }}', 'telegram_button')">
      My Telegram channel
      <span class="arrow">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </span>
    </div>
  </div>

  <script>
    var allowed = {{ 'true' if allowed else 'false' }};

    function handleClick(url, label) {
      if (!allowed) return;
      if (typeof gtag !== 'undefined') {
        gtag('event', 'click', {event_category: 'cta', event_label: label});
      }
      window.location.href = url;
    }
  </script>
</body>
</html>
